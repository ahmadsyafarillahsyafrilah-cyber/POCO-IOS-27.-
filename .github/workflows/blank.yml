
name: Build POCO IOS 27 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          unzip -q POCO_IOS_27_GitHub_Actions.zip -d source
          cd source/poco_ios27_work
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: POCO-IOS-27-debug-apk
          path: source/poco_ios27_work/app/build/outputs/apk/debug/app-debug.apk
